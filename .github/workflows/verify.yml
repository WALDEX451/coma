name: Verify COMA

on:
  push:
    branches: [main, coma-2.0-beta]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python integration smoke test
        run: python -m unittest discover -s test -p 'test_*.py' -v
      - name: Check browser JavaScript syntax
        run: node --check public/app.js
